                            "author": {
                                "@type": "Person",
                                "name": "ookk47oo"
                            },
                            "datePublished": "2024-11-23",
                            "reviewBody": "The official documentation left me feeling quite confused. The quickstart guide only mentioned which components to attach, but it didn&#39;t explain how to configure these components to achieve the corresponding effects.  I followed the subsequent tutorials to set up effect tags, but they didn’t work as expected. It seems like the built-in effects list isn’t created by default, and it took me a long time to find the button to generate the default effects. Even after applying the effect tags, they still didn’t take effect for some reason.  In preview mode, it also seems impossible to directly start the typewriter effect.  The most frustrating part is that there’s no option in the Inspector to adjust the text speed. I had to dig through the source code to expose the relevant parameter.  While the effects themselves look great, the usability and setup process are truly disappointing."

                            },

                            "reviewBody": "Works great.  The only thing that need to improve is a better test bed without forcing me to keep pressing the Play/Stop button to test the built-in effects. "

                            },
                            "datePublished": "2023-12-31",
                            "reviewBody": "Read and followed the docs multiple times and tried to get this to work consistently but I just can&#39;t. I get multiple fallback effect with tag &quot;incr&quot; and &quot;wave&quot; etc not found in database appearances database.   It was pretty cool when it worked but the editor window is also actually quite confusing for what you&#39;d think should be a simple asset. For example... &quot;the tags with warning icons will not be recognised by text animator.&quot; Right so what should I do about it? These are tags that I followed in the tutorial.. There&#39;s no mention of how to address a fix in the tooltip or the docs. Also the tags get consumed in your TMPro editor as soon as they are recognised so you have to keep writing them out. ERUGH. "

<script type="application/json" id="product-state">{"341308":{"id":"341308","productId":"279768036795","itemId":"279768032639","slug":"text-animator-for-unity-ui-toolkit-and-text-mesh-pro-341308","name":"Text Animator for Unity | UI Toolkit and Text Mesh Pro","description":"<p >&#128640; <strong>Welcome to Text Animator 3.0!!</strong> &#128640; Now including <strong>UI Toolkit support</strong> (From Unity 6.3), <strong>a new animation engine</strong> and much much more!</p></br><p >&#127942; <strong>Winner of Unity's Best Artistic Tool Award in 2023</strong>, Text Animator for Unity lets you bring your dialogues to life in a few steps.</p><p >✅ <strong>Unity Verified Solution since 2025</strong></p></br><p ><strong>Instantly add extra feel to your games:</strong></p><ul><li ><strong>UI Toolkit &amp; TMP Ready: </strong>seamlessly animates both Unity UI Toolkit and TextMeshPro.</li><li ><strong>Powerful Typewriter effect:</strong> control reveal speeds (per characters, puntuaction and words) and make letters appear and disappear dynamically.</li><li ><strong>15+ built in effects: </strong>apply effects like shake, wave, and fade instantly, or stack them for unique results.</li><li ><strong>Custom effects:</strong> create your own effects using the powerful Inspector</li><li ><strong>Custom Actions:</strong> trigger gameplay events when a specific letter is shown</li><li >and much more!</li></ul></br><p ><strong>Useful links</strong>:</p><ul><li ><strong>&#128279; </strong><a href=\"https://tools.febucci.com/text-animator/unity\" target=\"_blank\"><strong>Website</strong></a>: your main hub for all features, <strong>pricing</strong> and much more</li><li ><a href=\"https://tools.febucci.com/text-animator/unity/docs/quick-start/install-and-quick-start\" target=\"_blank\"><strong>&#128221; Documentation</strong></a>: learn everthing about the asset and <strong> feel comfortable </strong>even before downloading it.</li><li ><a href=\"https://tools.febucci.com/text-animator/showcase\" target=\"_blank\"> <strong>&#127918; Games</strong></a>: discover the many games that are using Text Animator and submit your(s) for future showcases.</li><li ><a href=\"https://tools.febucci.com/text-animator/unity/docs/welcome/requirements-and-limitations\" target=\"_blank\"><strong>&#128077;&#127995; Requirements</strong></a>: read its <strong> requirements </strong> and learn exactly what you can do.</li><li ><a href=\"https://tools.febucci.com/support?from=unity\" target=\"_blank\"><strong>&#128231; Support</strong></a>: for any question or support request.</li></ul></br><p ><strong>&#128395;️ Please note that the asset use a non-standard license!</strong> Previously it was per-seat, but it didn't help neither students, indies that didn't sign with publishers yet, and bigger teams with only a few developers per game but still inside a bigger entity. Now <strong>we grow as you grow</strong>, you pay only once - no matter the size of your team - and can use that version forever in any game (protected from retroactive changes as well). <a href=\"https://tools.febucci.com/text-animator/unity#pricing\" target=\"_blank\">Read more here</a> and let us know what you think!</p></br><p ><em>Have fun bringing your texts to life! You can read the \"Technical details\" below to also discover more information. Cheers!</em></p></br><p >This asset is governed by the <a href=\"https://tools.febucci.com/text-animator/legal/eula\" target=\"_blank\">Text Animator for Unity license terms</a><em>.</em></p>","aiDescription":"","elevatorPitch":"With Text Animator for Unity you can create typewriter effects, custom text animations in UI Toolkit & TMP, and bring texts to life in seconds. Chosen by Dredge, Cult of the Lamb & 20000+ devs.","keyFeatures":"<p ><strong>Features:</strong></p><ul><li >Supports <strong>UI Toolkit</strong> from Unity 6.3</li><li >Supports<strong> TextMeshPro</strong>, including its emotes, alignments and custom fonts.</li><li >Quick to set up (as fast as adding two components).</li><li >Create your own effects from the Inspector or C#.</li><li >Many built-in effects ready to use.</li><li >Supports multiple effects, stackable on the same letters.</li><li >Show and hide a text dynamically (like a typewriter), with different appearance and disappearance effects, from any direction and with custom speeds.</li><li >Call Events from text and perform any action.</li><li >Short, detailed and easy to read Documentation.</li></ul></br><p ><strong>Supports many platforms, like</strong>:</p><ul><li >Desktop (including Windows, macOs, Linux [..])</li><li >Console (including Nintendo Switch, XBOX and PlayStation)</li><li >Mobile (including iOs and Android)</li><li >WebGL (e.g. when uploading on Itch.io)</li><li >Including IL2CPP platforms</li></ul></br><p ><strong>Integrations</strong>:</p><ul><li >We are working on the integrations and their pages/documentation will be back asap! (as testing 10+ assets released by other developers, on 4+ Unity versions, with 2 Input Systems, 2 UI systems and more - is taking us <em>a lot</em> of time!)</li></ul><p >You can also integrate your own Dialogue Systems and Plugins! <em> (some are already planned in the future!). Take a look at the documentation for more.</em></p></br></br><p ><strong>Typewriter:</strong></p><ul><li >Show and hide text dynamically with multiple appearance effects.</li><li >Trigger events when a word/letter has been shown.</li><li >Play sounds for each letter.</li><li >Waits multiple pauses for specific characters (like puntuactions).</li><li >Via tags, waits for X seconds or for player input.</li><li >Increase or decrease its speed while typing.</li><li >Skip the typewriter and show the entire text on player input.</li></ul></br><p ><strong>Extra</strong>:</p><ul><li >Multiple Example scenes for each use case</li></ul></br><p ><strong>FAQ</strong></p><p ><strong>Does it work with TextMeshPro and UI Toolkit?</strong></p><p >Yes! The asset is fully compatible with Unity 2022 LTS and newer, supporting:</p><ul><li >TextMeshPro (TMP): works on all versions from 2022 and up</li><li >UI Toolkit: requires Unity 6.3+ (to leverage the new animation features).</li></ul><p >You don't need to replace components, just add the animator and keep your existing layout and fonts.</p></br><p ><strong>Does it work with dialogue systems (Yarn, Ink, etc.)?</strong></p><p >Yes. It is dialogue-agnostic and integrates seamlessly with Yarn Spinner, Ink, Naninovel, and Pixel Crushers, automatically handling typewriter effects and commands within your dialogue flow.</p></br><p ><strong>How does the Typewriter handle punctuation?</strong></p><p >It automatically pauses at punctuation (like commas and periods) for a natural reading rhythm. You can fully customize pause durations or speed via the Inspector.</p></br><p ><strong>Can I trigger sounds or events from text?</strong></p><p >Yes, using Action Tags. You can trigger events (e.g., &lt;?PlaySound&gt;) exactly when a specific character is revealed, ensuring perfect audio-visual synchronization.</p></br><p ><strong>Does it support standard Rich Text?</strong></p><p >Yes! You can mix standard tags (bold, color) with animation tags (like &lt;shake&gt;, &lt;wave&gt;) in the same string with zero conflicts. Please read the documentation for the tags that are not compatible/animated.</p></br><p ><em>The Asset uses the \"BounceOut\" Tween Method with the MIT license, and the Lato font under Open Font License (in example scenes); see Third-Party Notices.txt file in package for details - which allow you to ship games commercially. Thanks!</em></p><p >Enjoy!</p>","compatibilityInfo":"","srps":[{"version":"2022.3.62f2","types":["standard","lightweight","custom","hd"],"__typename":"SRP"},{"version":"6000.3.5f1","types":["standard","hd","lightweight","custom"],"__typename":"SRP"},{"version":"6000.4.0f1","types":["standard","hd","lightweight","custom"],"__typename":"SRP"},{"version":"6000.5.4f1","types":["standard
