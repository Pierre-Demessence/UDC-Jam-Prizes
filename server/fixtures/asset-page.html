                            "author": {
                                "@type": "Person",
                                "name": "ookk47oo"
                            },
                            "datePublished": "2024-11-23",
                            "reviewBody": "The official documentation left me feeling quite confused. The quickstart guide only mentioned which components to attach, but it didn&#39;t explain how to configure these components to achieve the corresponding effects.  I followed the subsequent tutorials to set up effect tags, but they didn’t work as expected. It seems like the built-in effects list isn’t created by default, and it took me a long time to find the button to generate the default effects. Even after applying the effect tags, they still didn’t take effect for some reason.  In preview mode, it also seems impossible to directly start the typewriter effect.  The most frustrating part is that there’s no option in the Inspector to adjust the text speed. I had to dig through the source code to expose the relevant parameter.  While the effects themselves look great, the usability and setup process are truly disappointing."

                            },
                            "datePublished": "2023-12-31",
                            "reviewBody": "Read and followed the docs multiple times and tried to get this to work consistently but I just can&#39;t. I get multiple fallback effect with tag &quot;incr&quot; and &quot;wave&quot; etc not found in database appearances database.   It was pretty cool when it worked but the editor window is also actually quite confusing for what you&#39;d think should be a simple asset. For example... &quot;the tags with warning icons will not be recognised by text animator.&quot; Right so what should I do about it? These are tags that I followed in the tutorial.. There&#39;s no mention of how to address a fix in the tooltip or the docs. Also the tags get consumed in your TMPro editor as soon as they are recognised so you have to keep writing them out. ERUGH. "
