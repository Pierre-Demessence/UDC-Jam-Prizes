                            "reviewBody": "Been waiting for ages to find a character that is AAA looking, super well rigged, clean hierarchy, etc. This is THE one. Everything is well done, Magica implementation on point. Pieces of armour have the same variant for male/female. I have literally nothing to say except that I WANT MORE costumes, styles etc."

                            "name": "﻿Well-made, with nice details.",

                                "@type": "Person",
                                "name": "someone1234567"
                            },
                            "datePublished": "2026-09-13",
                            "reviewBody": "There will be good things that I have missed or just not included here. Here are some things about these models.  Mesh: • The vertex count varies by place. It&#39;s lower on the middle of the upper arm and higher on the shoulder and elbow. It&#39;s high on the outside of the elbow where it stretches. • It has blend shapes for the faces. • The mouths have individual teeth.   Skeleton and weight painting: • It has extra bones at joints, like one on the elbow. When forearm_L bends, if you rotate z_elbow_L by half that amount, then the outside of the elbow stays looking elbow-shaped, which looks better than if those vertices were stretched between the upper and lower arm bones. The knees have have an extra bone too. The hips have two extra bones per leg which can be used to avoid the mesh collapsing inwards when the hip rotates. There&#39;s no separate bone for the shoulder-blade, though. • I have noticed one problem: When a shoulder rotates upwards, the neck collapses inwards. On the body mesh, the modelled clavicle bends instead of pivoting where it realistically attaches, and the shoulder-blade doesn&#39;t slide. On the armour mesh, the belt under the arm stretches. • The model has forearm &quot;Twist&quot; bones. • The jaw moves with blend shapes, and there&#39;s no jaw bone. • The eyes each have a bone. • It has bones with names ending in &quot;_end&quot; like forarm_Twist_L_end, which you get if you export from blender with &quot;Add Leaf Bones&quot; ticked."
