apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jam-prizes
  namespace: jam-prizes-prod
  annotations:
    # Materialize the Secret before the pod needs it.
    argocd.argoproj.io/sync-wave: '-1'
  labels:
    app.kubernetes.io/name: jam-prizes
    app.kubernetes.io/part-of: jam-prizes
    environment: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: jam-prizes
    creationPolicy: Owner
  data:
    # KEY_ENCRYPTION_SECRET encrypts donated key values at rest. Losing or
    # rotating it makes every stored key unreadable, so its 1Password entry is
    # the backup of record for the catalogue, not the volume.
    - secretKey: KEY_ENCRYPTION_SECRET
      remoteRef:
        key: jam-prizes-prod
        property: key-encryption-secret
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: jam-prizes-prod
        property: admin-password
    - secretKey: SESSION_SECRET
      remoteRef:
        key: jam-prizes-prod
        property: session-secret
