apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jam-prizes
  namespace: jam-prizes-prod
  labels:
    app.kubernetes.io/name: jam-prizes
    app.kubernetes.io/part-of: jam-prizes
    environment: prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # A flood is answered here, before it reaches the pod; the admin router is
    # pinned by address instead (ingress-admin.yaml).
    traefik.ingress.kubernetes.io/router.middlewares: default-rate-limit@kubernetescrd
spec:
  tls:
    - hosts:
        - prizes.jam.udc.ovh
      secretName: jam-prizes-tls
  rules:
    - host: prizes.jam.udc.ovh
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jam-prizes
                port:
                  number: 80
