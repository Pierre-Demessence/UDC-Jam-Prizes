apiVersion: apps/v1
kind: Deployment
metadata:
  name: jam-prizes
  namespace: jam-prizes-prod
  labels:
    app.kubernetes.io/name: jam-prizes
    app.kubernetes.io/part-of: jam-prizes
    environment: prod
spec:
  # SQLite is a single writer on a ReadWriteOnce volume: a second pod is a fault,
  # not redundancy, and Recreate keeps one from arriving before the other leaves.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jam-prizes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jam-prizes
        app.kubernetes.io/part-of: jam-prizes
        environment: prod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        # Makes the mounted volume writable by uid 1001, which SQLite needs.
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # The server closes the HTTP server and the database on SIGTERM.
      terminationGracePeriodSeconds: 30
      # The app never talks to the API server, so it needs no token.
      automountServiceAccountToken: false
      containers:
        - name: app
          # Pinned to the built commit's tag by .github/workflows/deploy.yml.
          image: ghcr.io/pierre-demessence/udc-jam-prizes:9f8f071
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3001'
            - name: DATABASE_PATH
              value: /data/prizes.sqlite
            # The node's pod range, which is where the app's peer address comes
            # from: it believes X-Forwarded-For only from these addresses, so the
            # rate limiter and the allow-list see visitors rather than the ingress
            # pod. A second node would get another /24 (the cluster's 10.42.0.0/16)
            # and need adding here.
            - name: TRUSTED_PROXY_ALLOWLIST
              value: 10.42.0.0/24
          envFrom:
            - secretRef:
                name: jam-prizes
          # Migrations run at startup, so a cold volume gets the slack here
          # rather than in the liveness probe.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          # A TCP check, not /api/health: a database hiccup should take the pod
          # out of the Service (the readiness probe) rather than restart it.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jam-prizes-data
        - name: tmp
          emptyDir: {}
