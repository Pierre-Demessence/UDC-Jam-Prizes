name: Deploy

# Runs only once CI has passed on main, so a red build never ships an image.
# The pin commit carries [skip ci]: a push with the default GITHUB_TOKEN starts no
# workflows, so today that is belt and braces — but it becomes load-bearing the
# moment the push uses a GitHub App token, which does trigger CI and would
# otherwise loop back into this workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The GHCR image name; the manifests use the shorter `jam-prizes` for resources.
  IMAGE_NAME: udc-jam-prizes
  MANIFEST_PATH: k8s/prod/deployment.yaml

jobs:
  build:
    name: Build & push image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout the commit CI passed on
        uses: actions/checkout@v5
        with:
          # A manual dispatch always builds main, so the built image and the
          # pinned tag can never come from different commits.
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the short SHA and the lowercased owner
        id: sha
        run: |
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.sha.outputs.owner }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}
            ghcr.io/${{ steps.sha.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.sha.outputs.owner }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.sha.outputs.owner }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,ignore-error=true

  pin:
    name: Pin the tag for ArgoCD
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Pin the image tag
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          MANIFEST_PATH: ${{ env.MANIFEST_PATH }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LC=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          # Owner-agnostic on purpose: the manifest keeps working if the repo moves.
          sed -i -E "s|image: ghcr\.io/[^/]+/${IMAGE_LC}:.*|image: ghcr.io/${OWNER_LC}/${IMAGE_LC}:${SHORT_SHA}|" "${MANIFEST_PATH}"
          grep -q "image: ghcr.io/${OWNER_LC}/${IMAGE_LC}:${SHORT_SHA}" "${MANIFEST_PATH}" \
            || { echo "::error::Failed to pin the image tag in ${MANIFEST_PATH}"; exit 1; }

      - name: Commit the pinned tag
        env:
          MANIFEST_PATH: ${{ env.MANIFEST_PATH }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${MANIFEST_PATH}"
          git diff --cached --quiet || git commit -m "chore(deploy): pin the prod image to ${SHORT_SHA} [skip ci]"
          # Someone pushing to main between the build and this commit would
          # otherwise make the push non-fast-forward.
          git pull --rebase --autostash
          git push
